name: "Tests BiblioTech"

# MODÈLE À COPIER dans .github/workflows/tests.yml (étape 4, jalon A).
# Lance les tests du socle et ceux du parcours (groupe « parcours ») à chaque push et chaque pull request.
on:
  push:
    paths: ["projetLaravel/**", ".github/workflows/tests.yml"]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    name: "Tests (socle + parcours)"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projetLaravel

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: bibliotech_test
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -proot"
          --health-interval=5s --health-timeout=5s --health-retries=20

    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: bibliotech_test
      DB_USERNAME: root
      DB_PASSWORD: root

    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: pdo_mysql, mbstring, intl
          coverage: none
      - uses: actions/cache@v4
        with:
          path: ~/.composer/cache/files
          key: composer-${{ hashFiles('projetLaravel/composer.lock') }}
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: cp .env.example .env && php artisan key:generate
      - name: "php artisan test --group=socle,parcours"
        run: php artisan test --group=socle,parcours
